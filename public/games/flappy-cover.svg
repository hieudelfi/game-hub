<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2e4a"/>
      <stop offset="100%" stop-color="#2a4a6e"/>
    </linearGradient>
  </defs>
  <rect width="300" height="400" fill="url(#sky)"/>

  <!-- ground -->
  <rect x="0" y="360" width="300" height="40" fill="#5a4028"/>
  <rect x="0" y="360" width="300" height="6" fill="#c4f47c"/>

  <!-- pipes -->
  <g fill="#4a8a3a">
    <rect x="50" y="0" width="60" height="130"/>
    <rect x="50" y="230" width="60" height="130"/>
    <rect x="200" y="0" width="60" height="180"/>
    <rect x="200" y="280" width="60" height="80"/>
  </g>
  <g fill="#6ab04a">
    <rect x="46" y="110" width="68" height="20"/>
    <rect x="46" y="230" width="68" height="20"/>
    <rect x="196" y="160" width="68" height="20"/>
    <rect x="196" y="280" width="68" height="20"/>
  </g>

  <!-- bird -->
  <g transform="translate(140,180) rotate(-15)">
    <rect x="-14" y="-14" width="28" height="28" fill="#f4b860"/>
    <rect x="-10" y="-4" width="10" height="10" fill="#e09040"/>
    <rect x="4" y="-10" width="7" height="7" fill="#fff"/>
    <rect x="6" y="-8" width="3" height="3" fill="#000"/>
    <rect x="12" y="-4" width="6" height="6" fill="#c8541f"/>
  </g>

  <text x="150" y="345" text-anchor="middle" font-family="system-ui,sans-serif" font-size="32" font-weight="700" fill="#eee">FLAPPY</text>
</svg>
